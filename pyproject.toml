[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "walk-forward-validator"
version = "0.2.0"
description = "Leak-free walk-forward validation splits for pandas time series."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "barobaonguyen" }]
keywords = ["walk-forward", "backtesting", "validation", "pandas", "time-series"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
dev = ["build", "pytest", "ruff"]
viz = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/barobaonguyen/walk-forward-validator"
Repository = "https://github.com/barobaonguyen/walk-forward-validator"
Issues = "https://github.com/barobaonguyen/walk-forward-validator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/walkforward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
